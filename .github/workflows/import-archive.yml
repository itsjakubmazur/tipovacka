name: Import archive

# Doimportuje historické galavečery OKTAGONU jako read-only archiv
# (is_archive = true). Po dávkách, protože celá historie se do jednoho
# běhu nevejde - jeden turnaj je jeden request na kartu plus zápisy za
# každý zápas a bojovníka.
#
# Pořadí při první instalaci:
#   1. tenhle workflow po dávkách (1-20, 21-40, ...)
#   2. Backfill fighter history (--all)   - historie bojovníků
# Statistiky se doplňují průběžně přímo tímhle importem.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Co importovat"
        required: true
        default: "range"
        type: choice
        options:
          - range
          - unnumbered
          - all
      number_from:
        description: "Od čísla OKTAGONu (jen pro mode=range)"
        required: false
        type: string
      number_to:
        description: "Do čísla OKTAGONu včetně (jen pro mode=range)"
        required: false
        type: string
      list_only:
        description: "Jen vypsat, nic nezapisovat"
        required: false
        default: false
        type: boolean

concurrency:
  group: import-archive
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Import
        working-directory: scraper
        env:
          MODE: ${{ inputs.mode }}
          NUMBER_FROM: ${{ inputs.number_from }}
          NUMBER_TO: ${{ inputs.number_to }}
          LIST_ONLY: ${{ inputs.list_only }}
        run: |
          args=""
          case "$MODE" in
            unnumbered) args="--unnumbered" ;;
            all)        args="--all" ;;
            *)          args="--from $NUMBER_FROM --to $NUMBER_TO" ;;
          esac
          if [ "$LIST_ONLY" = "true" ]; then args="$args --list"; fi
          python import_archive.py $args
