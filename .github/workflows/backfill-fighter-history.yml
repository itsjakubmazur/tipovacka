name: Backfill fighter history

# One-off: fills fighter_oktagon_fights for everybody already in the database.
# From then on cron.py keeps it current on its own (it refreshes the fighters
# of a card when the card is imported and when the gala finishes), so this is
# only ever needed after the initial migration - or if the table is wiped.
#
# One request per fighter against OKTAGON's API; a few hundred in total.
on:
  workflow_dispatch: {}

concurrency:
  group: backfill-fighter-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Import history for every fighter
        working-directory: scraper
        run: python import_fighter_history.py --all
