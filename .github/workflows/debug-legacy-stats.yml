name: Debug statistik u starých zápasů (dry run)

# Čtecí sonda: zjišťuje, odkud oktagonmma.com bere statistiky u zápasů
# starších než náš jediný zdroj (externí tracking od poloviny 2024).
# Nic nezapisuje.
on:
  workflow_dispatch:
    inputs:
      number:
        description: "Číslo OKTAGONu, na kterém se to má zkusit"
        required: false
        default: "28"
        type: string
  # Dokud tenhle workflow není na mainu, workflow_dispatch se nedá vyvolat -
  # tahle větev ho pouští rovnou pushem. Až sonda doslouží, zmizí to.
  push:
    branches: [claude/sweet-ritchie-4nt752]
    paths:
      - "scraper/debug_legacy_stats.py"
      - ".github/workflows/debug-legacy-stats.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Probe
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python debug_legacy_stats.py --number ${{ inputs.number || '28' }}
